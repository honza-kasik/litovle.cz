<p>
  <a href="/usneseni/" id="back-link">← Zpět na vyhledávání</a>
</p>

<script>
(function() {
  const a = document.getElementById("back-link");

  a.addEventListener("click", function(e) {
    // pokud je referrer z vyhledávání → použij ho
    if (document.referrer && document.referrer.includes("/usneseni?")) {
      e.preventDefault();
      location.href = document.referrer;
      return;
    }

    // fallback: když je historie
    if (history.length > 1) {
      e.preventDefault();
      history.back();
    }

    // jinak se použije normální href (/usneseni/)
  });
})();
</script>

<p>revokuje usnesení č. 252d/9.</p>
