<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>
        {% if page.title %}{{ page.title }} – {% endif %}{{ site.title }}
    </title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}" />

    <script type="application/ld+json">
    {
    "@context": "https://schema.org",
    "@graph": [
        {
        "@type": "Organization",
        "@id": "{{ site.url }}/#organization",
        "name": "Litovle.cz",
        "url": "{{ site.url }}",
        "description": "Nezávislý občanský web s praktickými informacemi a nástroji pro Litovel.",
        "sameAs": [
            "https://www.facebook.com/litovle/",
            "https://github.com/honza-kasik/litovle.cz"
        ]
        },
        {
        "@type": "WebSite",
        "@id": "{{ site.url }}/#website",
        "name": "Litovle.cz",
        "url": "{{ site.url }}",
        "description": "Nezávislý občanský web s praktickými informacemi a nástroji pro Litovel.",
        "publisher": {
            "@id": "{{ site.url }}/#organization"
        },
        "inLanguage": "cs",
        "hasPart": [
            {
            "@type": "WebSite",
            "name": "Svoz odpadu Litovel",
            "url": "https://svoz.litovle.cz/",
            "description": "Kalendář svozu odpadu pro Litovel podle ulic."
            },
            {
            "@type": "SoftwareApplication",
            "name": "Svoz odpadu Litovel",
            "operatingSystem": "Android",
            "applicationCategory": "UtilitiesApplication",
            "url": "https://play.google.com/store/apps/details?id=cz.litovle.svoz"
            }
        ]
        }
    ]
    }
    </script>

    {% if page.layout == "usneseni" %}
    <script type="application/ld+json">
    {
    "@context": "https://schema.org",
    "@type": "Legislation",
    "name": "{{ page.cislo }}",
    "legislationType": "MunicipalResolution",
    "datePublished": "{{ page.datum }}",
    "legislationBody": "{{ page.organ }}",
    "url": "{{ site.url }}{{ page.url }}"
    }
    </script>
    {% endif %}

    {% if page.description %}
    <meta name="description" content="{{ page.description }}">
    {% endif %}
    {% if page.canonical_url %}
    <link rel="canonical" href="{{ page.canonical_url }}">
    {% endif %}

</head>
<body>

<header class="site-header">
    <a href="{{ '/' | relative_url }}" class="logo">
        <img src="{{ '/assets/img/litovle_cz_small_transparent.png' | relative_url }}" alt="Litovle.cz">
    </a>

    <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Úvod</a>
        <a href="{{ '/zastupitelstvo/' | relative_url }}">Zastupitelstvo</a>
        <a href="{{ '/usneseni/' | relative_url }}">Usnesení</a>
        <a href="https://svoz.litovle.cz">Svoz odpadu</a>
        <a href="{{ '/o-projektu/' | relative_url }}">O projektu</a>
    </nav>
</header>

<main class="content">
    {{ content }}
</main>

<button type="button" id="site-back-to-top" class="site-back-to-top" aria-label="Zpět nahoru">↑ Nahoru</button>

<footer class="site-footer">
    © 2026 Litovle.cz · nezávislá občanská iniciativa<br>
    Vytvořil a spravuje Honza Kašík · <a href="https://honzakasik.cz" target="_blank" rel="noopener">honzakasik.cz</a>
</footer>

<!-- 100% privacy-first analytics -->
<script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>

<script>
(() => {
    const button = document.getElementById("site-back-to-top");
    if (!button || document.getElementById("usn-back-to-top")) return;

    const syncVisibility = () => {
        button.classList.toggle("is-visible", window.innerWidth <= 700 && window.scrollY > 700);
    };

    button.addEventListener("click", () => {
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        window.scrollTo({ top: 0, behavior: reducedMotion ? "auto" : "smooth" });
    });

    window.addEventListener("scroll", syncVisibility, { passive: true });
    window.addEventListener("resize", syncVisibility);
    syncVisibility();
})();
</script>

</body>
</html>
