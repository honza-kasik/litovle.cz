<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <title>{{ page.title | default: "Přesměrování" }}</title>
    <link rel="canonical" href="{{ page.redirect_to | relative_url }}">
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
    <script>
      window.location.replace("{{ page.redirect_to | relative_url }}");
    </script>
  </head>
  <body>
    <p>
      Stránka byla přesunuta na
      <a href="{{ page.redirect_to | relative_url }}">{{ page.redirect_label | default: page.redirect_to }}</a>.
    </p>
  </body>
</html>
